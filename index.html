<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>金刚智算云 · 运营管理</title>
<style>
  :root{
    --cyan:#36e2f8; --teal:#2de2c5; --blue:#3f8efc;
    --ok:#3ef0b0; --warn:#ffce54; --bad:#ff6b6b;
    --ink:#eaf4ff; --ink-2:#a8c3e2; --ink-3:#7e9cc0;
    --line:rgba(120,190,255,.16);
    --card:linear-gradient(160deg, rgba(30,72,128,.5), rgba(13,38,74,.62));
    --tile:rgba(8,30,62,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:#c3cedf;color:var(--ink);font-size:14px;
    display:flex;justify-content:center;min-height:100vh;
  }
  .phone{
    width:100%;max-width:430px;min-height:100vh;position:relative;
    display:flex;flex-direction:column;
    background:
      radial-gradient(120% 60% at 50% -5%, #15507f 0%, rgba(21,80,127,0) 55%),
      linear-gradient(180deg,#0e2f5c 0%, #0c2950 45%, #0a2240 100%);
    box-shadow:0 0 50px rgba(0,0,0,.3);
  }
  @media(min-width:470px){ .phone{min-height:900px;height:92vh;margin:2.5vh 0;border-radius:30px;overflow:hidden;} body{align-items:flex-start;} }

  /* ===== 顶部导航 ===== */
  .navbar{
    background:linear-gradient(180deg,#0d3168,#0c2c5c);
    color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;
    font-weight:700;font-size:16px;position:sticky;top:0;z-index:20;
    border-bottom:1px solid rgba(120,190,255,.12);
  }
  .navbar .back{cursor:pointer;font-size:21px;line-height:1;width:24px;color:#9fd9ff;}
  .navbar .title{flex:1;text-align:center;letter-spacing:1px;}
  .navbar .spacer{width:24px;}

  .content{flex:1;overflow-y:auto;padding:12px 12px 90px;-webkit-overflow-scrolling:touch;}

  /* ===== 底部 TabBar ===== */
  .tabbar{
    position:sticky;bottom:0;display:flex;z-index:20;
    background:rgba(6,18,38,.92);backdrop-filter:blur(10px);
    border-top:1px solid rgba(120,190,255,.14);
    margin:0 8px 8px;border-radius:18px;border:1px solid rgba(120,190,255,.14);
  }
  .tabbar .tab{flex:1;text-align:center;padding:9px 0 10px;font-size:11px;color:#6f8cb2;cursor:pointer;}
  .tabbar .tab .ico{font-size:19px;line-height:1.3;filter:grayscale(.4) brightness(.9);}
  .tabbar .tab.on{color:#4be1ff;font-weight:700;text-shadow:0 0 12px rgba(75,225,255,.7);}
  .tabbar .tab.on .ico{filter:none;}

  /* ===== 通用 ===== */
  .hero{
    position:relative;overflow:hidden;border-radius:18px;padding:18px;
    background:linear-gradient(120deg,#0f4d8f 0%,#0d6e9e 55%,#0aa6a0 100%);
    border:1px solid rgba(140,230,255,.3);
    box-shadow:0 8px 24px rgba(4,40,80,.45), inset 0 1px 0 rgba(255,255,255,.18);
    color:#fff;
  }
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 90% at 85% 15%,rgba(94,255,231,.25),transparent 60%);pointer-events:none;}
  .hero-title{font-size:21px;font-weight:800;letter-spacing:2px;}
  .hero-sub{margin-top:7px;font-size:12px;color:#cfeffb;}
  .hero .infinity{
    position:absolute;right:14px;top:4px;font-size:46px;font-weight:700;line-height:1;
    background:linear-gradient(100deg,#9be9ff,#2de2c5);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 10px rgba(45,226,197,.65));
  }
  .hero .dots{display:inline-block;margin-left:8px;letter-spacing:3px;color:rgba(190,250,255,.65);font-size:14px;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;padding:15px;margin-top:12px;
    box-shadow:0 6px 20px rgba(3,18,42,.35), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(6px);
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .card-title{font-size:15px;font-weight:700;position:relative;padding-left:11px;color:#fff;}
  .card-title::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:4px;border-radius:3px;
    background:linear-gradient(180deg,var(--cyan),var(--teal));box-shadow:0 0 8px rgba(54,226,248,.8);}
  .card-more{font-size:12px;color:#5fd6ff;cursor:pointer;}

  .metric-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .metric{
    flex:1 1 calc(50% - 5px);min-width:calc(50% - 5px);
    background:var(--tile);border:1px solid rgba(120,190,255,.14);
    border-radius:13px;padding:13px 12px;position:relative;overflow:hidden;
  }
  .metric.thirds{flex-basis:calc(33.33% - 7px);min-width:calc(33.33% - 7px);}
  .metric .bg-ico{position:absolute;right:6px;bottom:2px;font-size:40px;opacity:.14;pointer-events:none;}
  .metric::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 80% at 90% 100%,rgba(54,226,248,.10),transparent 60%);pointer-events:none;}
  .metric-label{font-size:12px;color:var(--ink-2);position:relative;z-index:1;}
  .metric-value{margin-top:6px;font-size:22px;font-weight:800;color:#fff;position:relative;z-index:1;text-shadow:0 0 14px rgba(80,200,255,.25);}
  .metric-value .unit{font-size:12px;font-weight:500;color:#8fd8ff;margin-left:2px;}
  .metric-value.brand{color:#7fe3ff;} .metric-value.accent{color:#3ef0b0;}

  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .dot.ok{background:var(--ok);box-shadow:0 0 7px rgba(62,240,176,.9);}
  .dot.warn{background:var(--warn);box-shadow:0 0 7px rgba(255,206,84,.9);}
  .dot.bad{background:var(--bad);box-shadow:0 0 7px rgba(255,107,107,.9);}
  .tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:6px;background:rgba(54,196,248,.16);color:#6fd9ff;border:1px solid rgba(54,196,248,.3);}
  .tag.ok{background:rgba(62,240,176,.13);color:var(--ok);border-color:rgba(62,240,176,.3);}
  .tag.warn{background:rgba(255,206,84,.13);color:var(--warn);border-color:rgba(255,206,84,.3);}
  .tag.bad{background:rgba(255,107,107,.13);color:var(--bad);border-color:rgba(255,107,107,.3);}
  .bar-track{height:8px;border-radius:6px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:5px;}
  .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#36a6f8,#36e2f8,#3ef0b0);box-shadow:0 0 8px rgba(54,226,248,.5);}
  .muted{color:var(--ink-3);font-size:11px;}
  .row{display:flex;align-items:center;} .between{justify-content:space-between;}
  .legend{margin-top:12px;text-align:center;font-size:11px;color:var(--ink-3);}

  /* ===== 算力地图 ===== */
  .map-wrap{position:relative;height:235px;margin-top:2px;}
  .map-wrap svg{width:100%;height:100%;display:block;}
  .pin-chip{
    position:absolute;display:flex;align-items:center;gap:4px;
    background:rgba(10,38,74,.88);border:1px solid rgba(110,220,255,.45);
    color:#dff6ff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.4),0 0 12px rgba(54,226,248,.25);
    white-space:nowrap;transform:translate(-50%,-50%);z-index:3;
  }
  .pin-chip .p-ico{color:#3ef0b0;font-size:11px;}
  .map-p{
    position:absolute;transform:translate(-50%,-50%);z-index:3;
    font-size:16px;font-weight:800;color:#fff;text-shadow:0 0 12px rgba(94,224,255,.8);white-space:nowrap;
  }
  .map-p small{font-size:10px;font-weight:600;color:#ffd789;}
  .site-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#5ee0ff;transform:translate(-50%,-50%);z-index:2;
    box-shadow:0 0 0 3px rgba(94,224,255,.25),0 0 14px rgba(94,224,255,.9);}
  .site-dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.5px solid rgba(94,224,255,.55);animation:pulse 2s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(.5);opacity:1;}100%{transform:scale(1.6);opacity:0;}}
  .flow{stroke-dasharray:5 6;animation:flow 1.6s linear infinite;}
  @keyframes flow{to{stroke-dashoffset:-44;}}

  /* ===== 算力健康（首页） ===== */
  .health-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .h-tile{
    background:var(--tile);border:1px solid rgba(120,190,255,.14);border-radius:13px;
    padding:12px 11px;position:relative;overflow:hidden;
  }
  .h-tile.tall{grid-row:span 2;min-height:165px;}
  .h-tile .bg-ico{position:absolute;right:4px;bottom:2px;font-size:44px;opacity:.13;pointer-events:none;}
  .h-label{font-size:12px;color:var(--ink-2);}
  .h-val{margin-top:6px;font-size:24px;font-weight:800;color:#fff;text-shadow:0 0 14px rgba(80,200,255,.3);}
  .h-sub{margin-top:5px;font-size:10.5px;color:var(--ink-3);}
  .h-art{position:absolute;left:8px;right:8px;bottom:8px;opacity:.8;}

  /* ===== 昨日业务 ===== */
  .biz-row{display:flex;align-items:center;padding:12px 0;}
  .biz-row+.biz-row{border-top:1px solid var(--line);}
  .biz-badge{
    width:52px;flex-shrink:0;margin-right:8px;text-align:center;
  }
  .biz-badge .pill{
    display:inline-block;padding:5px 10px;border-radius:10px;color:#fff;font-weight:800;font-size:13px;letter-spacing:1px;
  }
  .biz-badge.four .pill{background:linear-gradient(135deg,#2f7bff,#36c6f8);box-shadow:0 0 14px rgba(54,160,248,.55);}
  .biz-badge.two .pill{background:linear-gradient(135deg,#0bbf8f,#3ef0b0);box-shadow:0 0 14px rgba(62,240,176,.45);}
  .biz-badge .veh{font-size:17px;margin-top:3px;filter:drop-shadow(0 0 6px rgba(94,224,255,.6));}
  .biz-metrics{flex:1;display:flex;align-items:center;justify-content:space-between;}
  .biz-item{text-align:center;flex:1;}
  .bi-v{font-size:18px;font-weight:800;color:#fff;} .bi-v .unit{font-size:11px;font-weight:500;color:#8fd8ff;margin-left:1px;}
  .bi-l{font-size:11px;color:var(--ink-2);margin-top:3px;}
  .gauge{position:relative;width:58px;height:58px;margin:0 auto;}
  .gauge svg{width:100%;height:100%;}
  .g-track{fill:none;stroke:rgba(255,255,255,.12);stroke-width:6;}
  .g-fill{fill:none;stroke:url(#gaugeGrad);stroke-width:6;stroke-linecap:round;}
  .g-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;}
  .g-text span{font-size:9px;color:#8fd8ff;font-weight:600;}

  /* ===== 二级 Tab / 切换 ===== */
  .subtabs{display:flex;background:rgba(8,28,58,.7);border:1px solid var(--line);border-radius:12px;padding:4px;}
  .subtab{flex:1;text-align:center;padding:9px 0;font-size:13px;color:var(--ink-2);border-radius:8px;cursor:pointer;}
  .subtab.on{background:linear-gradient(135deg,#2f7bff,#36c6f8);color:#fff;font-weight:700;box-shadow:0 0 12px rgba(54,160,248,.5);}
  .side-toggle{display:flex;gap:8px;margin-top:12px;}
  .st{flex:1;text-align:center;padding:9px 0;background:rgba(8,28,58,.6);border-radius:9px;color:var(--ink-2);border:1px solid var(--line);cursor:pointer;}
  .st.on{border-color:rgba(94,224,255,.6);color:#5ee0ff;font-weight:700;background:rgba(20,60,110,.55);box-shadow:0 0 10px rgba(94,224,255,.25);}

  /* ===== 趋势 ===== */
  .t-row{display:flex;align-items:center;padding:6px 0;}
  .t-date{width:46px;font-size:12px;color:var(--ink-2);}
  .t-bar{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.09);overflow:hidden;margin:0 9px;}
  .t-bar .bar-fill{margin-top:0;}
  .t-val{width:62px;text-align:right;font-size:12px;font-weight:600;color:#dff0ff;}

  /* ===== 榜单 ===== */
  .rank{display:flex;align-items:center;padding:10px 0;}
  .rank+.rank{border-top:1px solid var(--line);}
  .r-no{width:25px;height:25px;border-radius:7px;margin-right:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--ink-3);background:rgba(255,255,255,.08);}
  .r-no.n1{background:linear-gradient(135deg,#ffb800,#ff8a00);color:#fff;box-shadow:0 0 10px rgba(255,160,0,.5);}
  .r-no.n2{background:linear-gradient(135deg,#c3cede,#93a0b3);color:#fff;}
  .r-no.n3{background:linear-gradient(135deg,#e0a06a,#c97f3e);color:#fff;}
  .r-body{flex:1;min-width:0;}
  .r-name{font-size:12.5px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dff0ff;}
  .r-val{width:80px;text-align:right;margin-left:9px;}
  .rv-n{font-size:16px;font-weight:800;color:#5ee0ff;}
  .rv-u{font-size:10px;color:var(--ink-3);}

  /* ===== 省份 ===== */
  .mini-toggle{font-size:12px;}
  .mini-toggle span{color:var(--ink-3);padding:2px 9px;border-radius:6px;cursor:pointer;}
  .mini-toggle span.on{color:#04253f;background:#5ee0ff;font-weight:700;}
  .prov{display:flex;align-items:flex-start;padding:10px 0;}
  .prov+.prov{border-top:1px solid var(--line);}
  .p-rank{width:23px;height:23px;border-radius:50%;margin-right:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#5ee0ff;background:rgba(94,224,255,.12);border:1px solid rgba(94,224,255,.3);}
  .p-body{flex:1;min-width:0;} .p-name{font-size:13.5px;font-weight:600;color:#eaf4ff;}
  .p-sub{margin-top:4px;font-size:11px;color:var(--ink-3);}

  /* ===== 算力页 ===== */
  .health-summary{display:flex;gap:16px;margin-top:11px;}
  .hs{font-size:12px;color:#dff6ff;}
  .ai-item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;}
  .ai-item+.ai-item{border-top:1px solid var(--line);}
  .ai-left{flex:1;min-width:0;padding-right:10px;}
  .ai-name{font-size:14px;font-weight:600;color:#eaf4ff;} .ai-note{margin-top:4px;font-size:11px;color:var(--ink-3);}
  .ai-right{text-align:right;flex-shrink:0;}
  .ai-val{font-size:18px;font-weight:800;}
  .ai-val.ok{color:var(--ok);text-shadow:0 0 12px rgba(62,240,176,.4);}
  .ai-val.warn{color:var(--warn);} .ai-val.bad{color:var(--bad);}
  .ai-th{font-size:10px;color:var(--ink-3);margin-top:2px;}

  /* ===== 资讯 ===== */
  .search{background:rgba(8,28,58,.7);border:1px solid var(--line);border-radius:11px;padding:3px 12px;}
  .search input{width:100%;border:0;outline:0;height:36px;font-size:13.5px;background:transparent;color:#eaf4ff;}
  .search input::placeholder{color:#5f7ea6;}
  .cats{white-space:nowrap;margin-top:10px;overflow-x:auto;display:flex;gap:7px;padding-bottom:2px;}
  .cats::-webkit-scrollbar{display:none;}
  .cat{display:inline-block;padding:6px 14px;background:rgba(8,28,58,.7);border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--ink-2);cursor:pointer;flex-shrink:0;}
  .cat.on{background:linear-gradient(135deg,#2f7bff,#36c6f8);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 0 12px rgba(54,160,248,.45);}
  .top-item{display:flex;align-items:center;padding:8px 0;cursor:pointer;}
  .top-item+.top-item{border-top:1px solid var(--line);}
  .top-item .tag{margin-right:7px;flex-shrink:0;}
  .top-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eaf4ff;}
  .news-item{padding:12px 0;cursor:pointer;}
  .news-item+.news-item{border-top:1px solid var(--line);}
  .ni-head{display:flex;align-items:center;gap:6px;}
  .ni-date{margin-left:auto;font-size:11px;color:var(--ink-3);}
  .ni-title{margin-top:7px;font-size:15px;font-weight:700;line-height:1.4;color:#fff;}
  .ni-sum{margin-top:5px;font-size:12.5px;color:var(--ink-2);line-height:1.6;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
  .ni-foot{margin-top:7px;display:flex;align-items:center;flex-wrap:wrap;gap:7px;}
  .ni-tag{font-size:11px;color:#5ee0ff;} .ni-src{margin-left:auto;font-size:11px;color:var(--ink-3);}
  .empty{text-align:center;color:var(--ink-3);padding:30px 0;font-size:13px;}

  /* ===== 详情 ===== */
  .d-title{margin-top:9px;font-size:19px;font-weight:800;line-height:1.4;color:#fff;}
  .d-meta{margin-top:6px;font-size:11.5px;color:var(--ink-3);}
  .d-summary{margin-top:11px;padding:11px;border-radius:9px;background:rgba(54,160,248,.10);font-size:13.5px;line-height:1.7;border-left:3px solid #36c6f8;color:#dff0ff;}
  .d-body{margin-top:12px;} .d-p{font-size:14px;line-height:1.85;margin-bottom:9px;white-space:pre-wrap;color:#d7e8fb;}
  .d-actions{display:flex;gap:10px;margin-top:15px;}
  .d-btn{flex:1;text-align:center;padding:13px 0;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;
    background:linear-gradient(135deg,#2f7bff,#36c6f8);color:#fff;box-shadow:0 0 14px rgba(54,160,248,.4);}
  .d-btn.ghost{background:rgba(8,28,58,.7);color:var(--ink-2);border:1px solid var(--line);box-shadow:none;}
  .d-btn.faved{background:linear-gradient(135deg,#c9982a,#ffce54);color:#3a2c00;}

  /* ===== 报表 ===== */
  .report-text{white-space:pre-wrap;font-size:13.5px;line-height:1.85;color:#d7e8fb;}

  /* ===== 我的 ===== */
  .menu{display:flex;align-items:center;padding:11px 0;cursor:pointer;}
  .menu+.menu{border-top:1px solid var(--line);}
  .m-ico{width:38px;height:38px;border-radius:11px;margin-right:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
    background:rgba(54,196,248,.12);color:#5ee0ff;border:1px solid rgba(54,196,248,.25);}
  .m-t{flex:1;font-size:14.5px;color:#eaf4ff;} .m-arrow{color:var(--ink-3);font-size:18px;}
  .fav{display:flex;align-items:center;padding:9px 0;cursor:pointer;}
  .fav+.fav{border-top:1px solid var(--line);}
  .fav .tag{margin-right:8px;flex-shrink:0;}
  .fav-t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eaf4ff;}

  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(8,30,60,.95);border:1px solid rgba(94,224,255,.4);color:#dff6ff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 0 18px rgba(54,226,248,.3);}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <div class="back" id="navBack" style="visibility:hidden">‹</div>
    <div class="title" id="navTitle">金刚智算云 · 运营驾驶舱</div>
    <div class="spacer"></div>
  </div>
  <div class="content" id="content"></div>
  <div class="tabbar" id="tabbar"></div>
</div>
<div class="toast" id="toast"></div>

<!-- 公共 SVG 渐变定义 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36c6f8"/><stop offset="1" stop-color="#3ef0b0"/>
    </linearGradient>
  </defs>
</svg>

<script>
/* ================= 数据层（来源：两个 Excel 驾驶舱 + 设计图算力地图） ================= */
var GLOBAL = { dataDate:'2025-06-09', updatedAt:'2025-06-10 09:00' };

var computeMap = [
  { name:'北京通州', power:'20000P', note:'建设中', x:63, y:33 },
  { name:'甘肃酒泉', power:'500P',  note:'',      x:36, y:40 },
  { name:'新疆哈密', power:'4000P', note:'',      x:24, y:42 }
];

var charging = {
  core:{

function pctOfMax(values){ var max=Math.max.apply(null,values.concat([0])); if(max<=0)return values.map(function(){return 0;}); return values.map(function(v){return Math.round(v/max*100);}); }
function comma(n){ return Number(n).toLocaleString('en-US'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function getFavs(){ try{ return JSON.parse(localStorage.getItem('news_favs')||'[]'); }catch(e){ return []; } }
function setFavs(a){ localStorage.setItem('news_favs',JSON.stringify(a)); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},1500); }
function gauge(pct){
  var r=24,c=2*Math.PI*r,f=Math.max(0,Math.min(pct,100))/100*c;
  return '<div class="gauge"><svg viewBox="0 0 60 60">'+
    '<circle class="g-track" cx="30" cy="30" r="'+r+'"/>'+
    '<circle class="g-fill" cx="30" cy="30" r="'+r+'" stroke-dasharray="'+f.toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 30 30)"/>'+
    '</svg><div class="g-text">'+pct+'<span>%利用率</span></div></div>';
}

function mc(cls,label,val,unit,vcls){ return '<div class="metric '+cls+'"><div class="metric-label">'+label+'</div><div class="metric-value '+(vcls||'')+'">'+val+(unit?'<span class="unit">'+unit+'</span>':'')+'</div></div>'; }

function chargingTrend(){
  var rows=charging.trend.map(function(r){var total=r.e4+r.s4+r.r2;return {date:r.date,total:total,wan:(total/10000).toFixed(2)};});
  var pcts=pctOfMax(rows.map(function(r){return r.total;}));
  rows.forEach(function(r,i){r.pct=pcts[i];});
  var totals=rows.map(function(r){return r.total;});
  var max=Math.max.apply(null,totals),min=Math.min.apply(null,totals),avg=totals.reduce(function(a,b){return a+b;},0)/totals.length;
  var maxR=rows.filter(function(r){return r.total===max;})[0], minR=rows.filter(function(r){return r.total===min;})[0];
  var h='<div class="card"><div class="card-head"><div class="card-title">近15日收入概况</div></div><div class="metric-grid">'+
    mc('thirds','最高日 '+maxR.date,maxR.wan,'万','brand')+
    mc('thirds','最低日 '+minR.date,minR.wan,'万')+
    mc('thirds','日均',(avg/10000).toFixed(2),'万','accent')+'</div></div>';
  h+='<div class="card"><div class="card-head"><div class="card-title">每日总收入（4轮电费+服务费 + 2轮收入）</div></div>';
  rows.forEach(function(r){ h+='<div class="t-row"><div class="t-date">'+r.date+'</div><div class="t-bar"><div class="bar-fill" style="width:'+r.pct+'%"></div></div><div class="t-val">'+r.wan+'万</div></div>'; });
  return h+'</div>';
}
function chargingTops(){

function reportText(type){
  var c=charging.core,d=GLOBAL.dataDate;
  var totals=charging.trend.map(function(r){return {date:r.date,total:r.e4+r.s4+r.r2};});
  var max=totals.reduce(function(a,b){return b.total>a.total?b:a;}),min=totals.reduce(function(a,b){return b.total<a.total?b:a;});
  var t1=charging.topFee[0];
  if(type===0){
    return '【金刚智算云 · 充电桩业务简报】\n截至 '+d+'：\n4轮上线总枪数 '+comma(c.onlineTotal.four)+' 枪，2轮上线总枪数 '+comma(c.onlineTotal.two)+' 枪。\n当月新增 4轮 '+c.monthNew.four+' 枪 / 2轮 '+c.monthNew.two+' 枪。\n\n4轮：昨日服务费 '+c.serviceFee.yesterday.four+' 万元，单枪日均充电量 '+c.chargePerGun.yesterday.four+' kWh，利用率 '+c.utilization.yesterday.four+'%。\n2轮：昨日收入 '+c.serviceFee.yesterday.two+' 万元，单枪日均充电量 '+c.chargePerGun.yesterday.two+' kWh，利用率 '+c.utilization.yesterday.two+'%。\n\n近15日收入：最高日 '+max.date+'（'+(max.total/10000).toFixed(2)+' 万元），最低日 '+min.date+'（'+(min.total/10000).toFixed(2)+' 万元）。\n本月服务费 TOP1 站点：'+t1.name+'（'+t1.value+' 万元）。';
  } else if(type===1){
    return '【金刚智算云 · 算力中心运行简报】\n截至 '+d+'：\n算力中心总节点 '+aiVal('算力中心总节点')+'，标称总算力 '+aiVal('标称总算力(FP16)')+'。\n裸金属综合上架率 '+aiVal('裸金属综合上架率')+'，SLA 整体在线率 '+aiVal('SLA 整体在线率')+'。\n实时 PUE '+aiVal('实时 PUE')+'，液冷进/出水温 '+aiVal('液冷进/出水温')+'。\nIB/RoCE 连通率 '+aiVal('IB/RoCE 连通率')+'，RDMA 丢包率 '+aiVal('RDMA 丢包率')+'，GPU XID 报错 '+aiVal('GPU XID 报错拦截')+'。\n当前响应中运维工单 '+aiVal('响应中运维工单')+'，核心备件可用率 '+aiVal('核心备件可用率')+'。\n整体状态：全部指标达标。';
  } else {
    var pt=charging.provinces.slice().sort(function(a,b){return b.monthAvg-a.monthAvg;}).slice(0,3).map(function(p){return p.name+'('+p.monthAvg+')';}).join('、');
    return '【金刚智算云 · 本周运营周报】\n数据日期：'+d+'\n\n一、本周经营\n本月服务费 4轮 '+c.serviceFee.month.four+' 万元 / 2轮 '+c.serviceFee.month.two+' 万元；\n当月利用率 4轮 '+c.utilization.month.four+'% / 2轮 '+c.utilization.month.two+'%。\n\n二、本周榜单\n月服务费 TOP1：'+charging.topFee[0].name+'（'+charging.topFee[0].value+'万）；\n单枪充电量 TOP1：'+charging.topCharge[0].name+'（'+charging.topCharge[0].value+'kWh）；\n本月日均领先省份：'+pt+'。\n\n三、算力健康\nSLA '+aiVal('SLA 整体在线率')+'，PUE '+aiVal('实时 PUE')+'，IB/RoCE '+aiVal('IB/RoCE 连通率')+'，响应中工单 '+aiVal('响应中运维工单')+'。\n\n四、本周资讯（择要）\n1）分时电价峰谷价差拉大，关注谷段补能与调价空间；\n2）液冷渗透提升，PUE 成 AIDC 核心卡位指标；\n3）绿电交易扩大，探索充电/算力绿电标签。';
  }
}

/* ================= 路由 / 渲染 ================= */
var TITLES={index:'金刚智算云 · 运营驾驶舱',charging:'充电桩运营',compute:'算力健康',news:'行业资讯',mine:'我的',report:'报表汇总',detail:'资讯详情'};
function render(){
  var view=S.sub||S.tab, html='';
  if(view==='index') html=viewIndex();
  else if(view==='charging') html=viewCharging();
  else if(view==='compute') html=viewCompute();
  else if(view==='news') html=viewNews();
  else if(view==='mine') html=viewMine();
  else if(view==='report') html=viewReport();
  else if(view==='detail') html=viewDetail();
  document.getElementById('content').innerHTML=html;
  document.getElementById('content').scrollTop=0;
  document.getElementById('navTitle').textContent=TITLES[view]||'金刚智算云';
  document.getElementById('navBack').style.visibility=S.sub?'visible':'hidden';
  document.getElementById('tabbar').innerHTML=TABS.map(function(t){return '<div class="tab '+(!S.sub&&S.tab===t.key?'on':'')+'" data-tab="'+t.key+'"><div class="ico">'+t.ico+'</div><div>'+t.text+'</div></div>';}).join('');
}

/* ================= 事件 ================= */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-go],[data-ctab],[data-side],[data-psort],[data-ncat],[data-news],[data-fav],[data-copylink],[data-rtype],[data-copyreport],[data-about]');
  if(!t) return;
  var d=t.dataset;
  if(d.tab){ S.sub=null; S.tab=d.tab; render(); return; }
  if(d.go!==undefined){
    var go=d.go;
    if(go==='report'){ S.sub='report'; render(); return; }
    if(d.ctab!==undefined) S.chargingTab=Number(d.ctab);
    S.sub=null; S.tab=go; render(); return;
  }
  if(d.ctab!==undefined){ S.chargingTab=Number(d.ctab); render(); return; }
  if(d.side){ S.side=d.side; render(); return; }
  if(d.psort){ S.provSort=d.psort; render(); return; }
  if(d.ncat){ S.newsCat=d.ncat; render(); return; }
  if(d.news){ S.sub='detail'; S.detailId=d.news; render(); return; }
  if(d.rtype!==undefined){ S.reportType=Number(d.rtype); render(); return; }
  if(d.fav){ var f=getFavs(),id=d.fav; if(f.indexOf(id)>-1){f=f.filter(function(x){return x!==id;});toast('已取消收藏');}else{f.push(id);toast('已收藏');} setFavs(f); render(); return; }
  if(d.copylink){ var n=news.filter(function(x){return x.id===d.copylink;})[0]; if(n&&n.link){copy(n.link);toast('已复制链接');}else toast('暂无原文链接'); return; }
  if(d.copyreport){ copy(reportText(S.reportType)); toast('已复制，可粘贴到汇报'); return; }
  if(d.about){ alert('金刚智算云运营管理小程序 · 第一版\n聚焦已有数据移动化、可视化、汇报化。\n数据来源：充电桩运营驾驶舱、算力运营驾驶舱。'); return; }
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='newsSearch'){
    S.newsKeyword=e.target.value;
    var cont=document.getElementById('content');
    var scroll=cont.scrollTop;
    cont.innerHTML=viewNews();
    var inp=document.getElementById('newsSearch'); if(inp){inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);}
    cont.scrollTop=scroll;
  }
});
document.getElementById('navBack').addEventListener('click',function(){ S.sub=null; render(); });
function copy(text){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(function(){fallbackCopy(text);});}else fallbackCopy(text); }
function fallbackCopy(text){ var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }

render();
</script>
</body>
</html>
