<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>金刚智算云 · AI 智算集群展示与算力资讯平台</title>
<style>
  :root{
    --cyan:#36e2f8; --teal:#2de2c5; --blue:#3f8efc;
    --ok:#3ef0b0; --warn:#ffce54; --bad:#ff6b6b;
    --ink:#eaf4ff; --ink-2:#a8c3e2; --ink-3:#7e9cc0;
    --line:rgba(120,190,255,.16);
    --card:linear-gradient(160deg, rgba(30,72,128,.5), rgba(13,38,74,.62));
    --tile:rgba(8,30,62,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:#c3cedf;color:var(--ink);font-size:14px;
    display:flex;justify-content:center;min-height:100vh;
  }
  .phone{
    width:100%;max-width:430px;min-height:100vh;position:relative;
    display:flex;flex-direction:column;
    background:
      radial-gradient(120% 60% at 50% -5%, #15507f 0%, rgba(21,80,127,0) 55%),
      linear-gradient(180deg,#0e2f5c 0%, #0c2950 45%, #0a2240 100%);
    box-shadow:0 0 50px rgba(0,0,0,.3);
  }
  @media(min-width:470px){ .phone{min-height:900px;height:92vh;margin:2.5vh 0;border-radius:30px;overflow:hidden;} body{align-items:flex-start;} }

  /* ===== 顶部导航 ===== */
  .navbar{
    background:linear-gradient(180deg,#0d3168,#0c2c5c);
    color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;
    font-weight:700;font-size:16px;position:sticky;top:0;z-index:20;
    border-bottom:1px solid rgba(120,190,255,.12);
  }
  .navbar .back{cursor:pointer;font-size:21px;line-height:1;width:24px;color:#9fd9ff;}
  .navbar .title{flex:1;text-align:center;letter-spacing:1px;}
  .navbar .spacer{width:24px;}

  .content{flex:1;overflow-y:auto;padding:12px 12px 90px;-webkit-overflow-scrolling:touch;}

  /* ===== 底部 TabBar ===== */
  .tabbar{
    position:sticky;bottom:0;display:flex;z-index:20;
    background:rgba(6,18,38,.92);backdrop-filter:blur(10px);
    margin:0 8px 8px;border-radius:18px;border:1px solid rgba(120,190,255,.14);
  }
  .tabbar .tab{flex:1;text-align:center;padding:9px 0 10px;font-size:11px;color:#6f8cb2;cursor:pointer;}
  .tabbar .tab .ico{font-size:19px;line-height:1.3;filter:grayscale(.4) brightness(.9);}
  .tabbar .tab.on{color:#4be1ff;font-weight:700;text-shadow:0 0 12px rgba(75,225,255,.7);}
  .tabbar .tab.on .ico{filter:none;}

  /* ===== 通用 ===== */
  .hero{
    position:relative;overflow:hidden;border-radius:18px;padding:18px;
    background:linear-gradient(120deg,#0f4d8f 0%,#0d6e9e 55%,#0aa6a0 100%);
    border:1px solid rgba(140,230,255,.3);
    box-shadow:0 8px 24px rgba(4,40,80,.45), inset 0 1px 0 rgba(255,255,255,.18);
    color:#fff;
  }
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 90% at 85% 15%,rgba(94,255,231,.25),transparent 60%);pointer-events:none;}
  .hero-title{font-size:22px;font-weight:800;letter-spacing:2px;}
  .hero-sub{margin-top:8px;font-size:12.5px;color:#cfeffb;line-height:1.7;position:relative;z-index:1;}
  .hero .infinity{
    position:absolute;right:14px;top:4px;font-size:46px;font-weight:700;line-height:1;
    background:linear-gradient(100deg,#9be9ff,#2de2c5);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 10px rgba(45,226,197,.65));
  }
  .hero-btns{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1;}
  .hero-btn{
    flex:1;text-align:center;padding:10px 0;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;backdrop-filter:blur(4px);
  }
  .hero-btn.primary{background:rgba(10,40,70,.45);border-color:rgba(140,240,255,.55);color:#aef3ff;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;padding:15px;margin-top:12px;
    box-shadow:0 6px 20px rgba(3,18,42,.35), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(6px);
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .card-title{font-size:15px;font-weight:700;position:relative;padding-left:11px;color:#fff;}
  .card-title::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:4px;border-radius:3px;
    background:linear-gradient(180deg,var(--cyan),var(--teal));box-shadow:0 0 8px rgba(54,226,248,.8);}
  .card-more{font-size:12px;color:#5fd6ff;cursor:pointer;}

  .metric-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .metric{
    flex:1 1 calc(50% - 5px);min-width:calc(50% - 5px);
    background:var(--tile);border:1px solid rgba(120,190,255,.14);
    border-radius:13px;padding:12px 11px;position:relative;overflow:hidden;
  }
  .metric.thirds{flex-basis:calc(33.33% - 7px);min-width:calc(33.33% - 7px);}
  .metric::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 80% at 90% 100%,rgba(54,226,248,.10),transparent 60%);pointer-events:none;}
  .metric-label{font-size:11.5px;color:var(--ink-2);position:relative;z-index:1;white-space:nowrap;}
  .metric-value{margin-top:6px;font-size:20px;font-weight:800;color:#fff;position:relative;z-index:1;text-shadow:0 0 14px rgba(80,200,255,.25);white-space:nowrap;}
  .metric-value .unit{font-size:11px;font-weight:500;color:#8fd8ff;margin-left:2px;}
  .metric-value.txt{font-size:15px;letter-spacing:1px;line-height:1.5;padding-top:3px;}

  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .dot.ok{background:var(--ok);box-shadow:0 0 7px rgba(62,240,176,.9);}
  .dot.warn{background:var(--warn);box-shadow:0 0 7px rgba(255,206,84,.9);}
  .tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:6px;background:rgba(54,196,248,.16);color:#6fd9ff;border:1px solid rgba(54,196,248,.3);}
  .tag.ok{background:rgba(62,240,176,.13);color:var(--ok);border-color:rgba(62,240,176,.3);}
  .tag.warn{background:rgba(255,206,84,.13);color:var(--warn);border-color:rgba(255,206,84,.3);}
  .tag.bad{background:rgba(255,107,107,.13);color:var(--bad);border-color:rgba(255,107,107,.3);}
  .muted{color:var(--ink-3);font-size:11px;}
  .row{display:flex;align-items:center;} .between{justify-content:space-between;}
  .legend{margin-top:12px;text-align:center;font-size:11px;color:var(--ink-3);line-height:1.7;}

  /* ===== SVG 动效 ===== */
  .flow{stroke-dasharray:5 6;animation:flow 1.6s linear infinite;}
  @keyframes flow{to{stroke-dashoffset:-44;}}
  .tw{animation:tw 2.4s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.15;}50%{opacity:1;}}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .breathe{animation:breathe 3s ease-in-out infinite;}
  @keyframes breathe{0%,100%{opacity:.35;}50%{opacity:.9;}}

  /* ===== 算力地图 ===== */
  .map-wrap{position:relative;height:235px;margin-top:2px;}
  .map-wrap svg{width:100%;height:100%;display:block;}
  .pin-chip{
    position:absolute;display:flex;align-items:center;gap:4px;
    background:rgba(10,38,74,.88);border:1px solid rgba(110,220,255,.45);
    color:#dff6ff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.4),0 0 12px rgba(54,226,248,.25);
    white-space:nowrap;transform:translate(-50%,-50%);z-index:3;cursor:pointer;
  }
  .pin-chip .p-ico{color:#3ef0b0;font-size:11px;}
  .map-p{
    position:absolute;transform:translate(-50%,-50%);z-index:3;
    font-size:16px;font-weight:800;color:#fff;text-shadow:0 0 12px rgba(94,224,255,.8);white-space:nowrap;
  }
  .map-p small{font-size:10px;font-weight:600;color:#ffd789;}
  .site-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#5ee0ff;transform:translate(-50%,-50%);z-index:2;
    box-shadow:0 0 0 3px rgba(94,224,255,.25),0 0 14px rgba(94,224,255,.9);}
  .site-dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.5px solid rgba(94,224,255,.55);animation:pulse 2s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(.5);opacity:1;}100%{transform:scale(1.6);opacity:0;}}

  /* ===== 算力健康（首页） ===== */
  .health-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .h-tile{
    background:var(--tile);border:1px solid rgba(120,190,255,.14);border-radius:13px;
    padding:12px 11px;position:relative;overflow:hidden;
  }
  .h-tile.tall{grid-row:span 2;min-height:165px;}
  .h-tile .bg-ico{position:absolute;right:4px;bottom:2px;font-size:42px;opacity:.13;pointer-events:none;}
  .h-label{font-size:12px;color:var(--ink-2);}
  .h-val{margin-top:6px;font-size:23px;font-weight:800;color:#fff;text-shadow:0 0 14px rgba(80,200,255,.3);}
  .h-sub{margin-top:5px;font-size:10.5px;color:var(--ink-3);line-height:1.6;}
  .h-art{position:absolute;left:8px;right:8px;bottom:8px;opacity:.85;}

  /* ===== 集群卡片（按设计图二） ===== */
  .cluster-card{
    background:linear-gradient(165deg, rgba(22,58,106,.72), rgba(9,30,62,.85));
    border:1px solid rgba(110,200,255,.22);border-radius:16px;
    overflow:hidden;margin-top:13px;cursor:pointer;position:relative;
    box-shadow:0 8px 22px rgba(3,18,42,.45), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .cc-ribbon{
    position:absolute;left:12px;top:12px;z-index:4;
    background:rgba(7,26,54,.85);border:1px solid rgba(110,220,255,.5);
    color:#bfeeff;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:8px;
    box-shadow:0 0 14px rgba(54,226,248,.3);backdrop-filter:blur(4px);letter-spacing:.5px;
  }
  .cc-art{height:150px;position:relative;overflow:hidden;}
  .cc-art svg{width:100%;height:100%;display:block;}
  .cc-art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;
    background:linear-gradient(180deg,transparent,rgba(10,30,60,.55));pointer-events:none;}
  .cc-body{padding:13px 14px 14px;}
  .cc-name{font-size:16.5px;font-weight:800;color:#fff;letter-spacing:.5px;}
  .status-pill{
    flex-shrink:0;margin-left:8px;font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;
  }
  .status-pill.run{color:#3ef0b0;border:1px solid rgba(62,240,176,.55);background:rgba(62,240,176,.1);box-shadow:0 0 10px rgba(62,240,176,.25);}
  .status-pill.build{color:#ffce54;border:1px solid rgba(255,206,84,.55);background:rgba(255,206,84,.1);box-shadow:0 0 10px rgba(255,206,84,.25);}
  .cc-desc{margin-top:8px;font-size:12.5px;color:#b9d6f2;line-height:1.65;}
  .cc-tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:7px;}
  .cc-tag{
    font-size:11px;padding:4px 11px;border-radius:7px;
    background:rgba(54,160,248,.13);border:1px solid rgba(94,200,255,.32);color:#8fdcff;
    display:inline-flex;align-items:center;gap:4px;
  }
  .cc-tag .ti{font-size:11px;line-height:1;}
  .ct-sub{font-size:12px;color:var(--ink-3);font-weight:500;margin-left:3px;}
  .cc-foot{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .cc-hl{
    font-size:13.5px;font-weight:700;color:#e8f6ff;letter-spacing:.5px;
    padding-left:9px;border-left:3px solid var(--teal);
  }
  .cc-btn{
    flex-shrink:0;font-size:12.5px;font-weight:600;color:#aee9ff;cursor:pointer;
    background:rgba(54,160,248,.16);border:1px solid rgba(94,200,255,.45);
    padding:8px 16px;border-radius:999px;box-shadow:0 0 12px rgba(54,160,248,.25);
  }

  /* ===== 集群详情 ===== */
  .detail-hero{border-radius:16px;overflow:hidden;border:1px solid rgba(120,190,255,.22);position:relative;}
  .detail-hero svg{width:100%;height:170px;display:block;}
  .detail-hero .dh-cap{
    position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;font-size:10.5px;color:#bfe2ff;
    background:linear-gradient(180deg,transparent,rgba(5,18,40,.92));
  }
  .blk{padding:12px 0;}
  .blk+.blk{border-top:1px solid var(--line);}
  .blk-t{font-size:13.5px;font-weight:700;color:#7fd9e8;margin-bottom:6px;}
  .blk-c{font-size:13.5px;line-height:1.8;color:#d7e8fb;}

  /* ===== 资讯（图文排版） ===== */
  .search{background:rgba(8,28,58,.7);border:1px solid var(--line);border-radius:11px;padding:3px 12px;}
  .search input{width:100%;border:0;outline:0;height:36px;font-size:13.5px;background:transparent;color:#eaf4ff;}
  .search input::placeholder{color:#5f7ea6;}
  .cats{white-space:nowrap;margin-top:10px;overflow-x:auto;display:flex;gap:7px;padding-bottom:2px;}
  .cats::-webkit-scrollbar{display:none;}
  .cat{display:inline-block;padding:6px 14px;background:rgba(8,28,58,.7);border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--ink-2);cursor:pointer;flex-shrink:0;}
  .cat.on{background:linear-gradient(135deg,#2f7bff,#36c6f8);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 0 12px rgba(54,160,248,.45);}
  .top-item{display:flex;align-items:center;padding:8px 0;cursor:pointer;}
  .top-item+.top-item{border-top:1px solid var(--line);}
  .top-item .tag{margin-right:7px;flex-shrink:0;}
  .top-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eaf4ff;}

  .news-item{display:flex;gap:11px;padding:13px 0;cursor:pointer;align-items:stretch;}
  .news-item+.news-item{border-top:1px solid var(--line);}
  .ni-thumb{
    width:84px;min-height:84px;border-radius:13px;flex-shrink:0;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(140,220,255,.25);
  }
  .ni-thumb .glyph{font-size:32px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));position:relative;z-index:1;}
  .ni-thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 80% at 75% 20%,rgba(255,255,255,.22),transparent 55%);}
  .ni-thumb .t-cat{
    position:absolute;left:0;right:0;bottom:0;z-index:2;text-align:center;
    font-size:9.5px;font-weight:700;color:#eaf8ff;padding:3px 0;
    background:rgba(5,20,42,.55);backdrop-filter:blur(2px);letter-spacing:1px;
  }
  .ni-main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .ni-title{font-size:14px;font-weight:700;line-height:1.45;color:#fff;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
  .ni-sum{margin-top:5px;font-size:11.5px;color:var(--ink-2);line-height:1.55;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden;}
  .ni-meta{margin-top:auto;padding-top:6px;display:flex;align-items:center;gap:6px;}
  .ni-date{margin-left:auto;font-size:10.5px;color:var(--ink-3);}
  .ni-tag{font-size:11px;color:#5ee0ff;} .ni-src{margin-left:auto;font-size:11px;color:var(--ink-3);}
  .ni-foot{margin-top:7px;display:flex;align-items:center;flex-wrap:wrap;gap:7px;}
  .empty{text-align:center;color:var(--ink-3);padding:30px 0;font-size:13px;}

  /* ===== 详情 ===== */
  .d-title{margin-top:9px;font-size:19px;font-weight:800;line-height:1.4;color:#fff;}
  .d-meta{margin-top:6px;font-size:11.5px;color:var(--ink-3);}
  .d-summary{margin-top:11px;padding:11px;border-radius:9px;background:rgba(54,160,248,.10);font-size:13.5px;line-height:1.7;border-left:3px solid #36c6f8;color:#dff0ff;}
  .d-body{margin-top:12px;} .d-p{font-size:14px;line-height:1.85;margin-bottom:9px;white-space:pre-wrap;color:#d7e8fb;}
  .d-actions{display:flex;gap:10px;margin-top:15px;}
  .d-btn{flex:1;text-align:center;padding:13px 0;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;
    background:linear-gradient(135deg,#2f7bff,#36c6f8);color:#fff;box-shadow:0 0 14px rgba(54,160,248,.4);}
  .d-btn.ghost{background:rgba(8,28,58,.7);color:var(--ink-2);border:1px solid var(--line);box-shadow:none;}
  .d-btn.faved{background:linear-gradient(135deg,#c9982a,#ffce54);color:#3a2c00;}

  /* ===== 合作表单 ===== */
  .f-label{font-size:12.5px;color:var(--ink-2);margin:13px 0 6px;}
  .f-label .req{color:#ff8a8a;margin-left:2px;}
  .f-input{
    width:100%;background:rgba(8,28,58,.7);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;font-size:13.5px;color:#eaf4ff;outline:none;
  }
  .f-input:focus{border-color:rgba(94,224,255,.55);box-shadow:0 0 10px rgba(94,224,255,.2);}
  textarea.f-input{min-height:84px;resize:none;font-family:inherit;line-height:1.6;}
  .opts{display:flex;flex-wrap:wrap;gap:8px;}
  .opt{
    padding:7px 14px;border-radius:999px;font-size:12.5px;cursor:pointer;
    background:rgba(8,28,58,.7);border:1px solid var(--line);color:var(--ink-2);
  }
  .opt.on{background:linear-gradient(135deg,#2f7bff,#36c6f8);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 0 10px rgba(54,160,248,.45);}
  .coop-type{display:flex;align-items:flex-start;padding:11px 0;}
  .coop-type+.coop-type{border-top:1px solid var(--line);}
  .ct-ico{width:36px;height:36px;border-radius:10px;margin-right:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;
    background:rgba(54,196,248,.12);border:1px solid rgba(54,196,248,.25);}
  .ct-t{font-size:14px;font-weight:700;color:#eaf4ff;}
  .ct-d{margin-top:3px;font-size:11.5px;color:var(--ink-3);}

  /* ===== 我的 ===== */
  .menu{display:flex;align-items:center;padding:11px 0;cursor:pointer;}
  .menu+.menu{border-top:1px solid var(--line);}
  .m-ico{width:38px;height:38px;border-radius:11px;margin-right:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
    background:rgba(54,196,248,.12);color:#5ee0ff;border:1px solid rgba(54,196,248,.25);}
  .m-t{flex:1;font-size:14.5px;color:#eaf4ff;} .m-arrow{color:var(--ink-3);font-size:18px;}
  .fav{display:flex;align-items:center;padding:9px 0;cursor:pointer;}
  .fav+.fav{border-top:1px solid var(--line);}
  .fav .tag{margin-right:8px;flex-shrink:0;}
  .fav-t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eaf4ff;}

  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(8,30,60,.95);border:1px solid rgba(94,224,255,.4);color:#dff6ff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 0 18px rgba(54,226,248,.3);}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <div class="back" id="navBack" style="visibility:hidden">‹</div>
    <div class="title" id="navTitle">金刚智算云</div>
    <div class="spacer"></div>
  </div>
  <div class="content" id="content"></div>
  <div class="tabbar" id="tabbar"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 数据层 ================= */
var GLOBAL = { updatedAt:'2025-06-10' };

/* —— 算力集群 —— */
var clusters = [
  {
    id:'hami', short:'哈密',
    name:'新疆哈密算力集群',
    region:'新疆 · 哈密', type:'集群型',
    ribbon:'西部能源算力集群',

/* ================= 资讯（图文排版） ================= */
function newsThumb(cat){
  var t=catThumb[cat]||catThumb['算力知识'];
  return '<div class="ni-thumb" style="background:'+t.g+'"><span class="glyph">'+t.glyph+'</span><span class="t-cat">'+cat+'</span></div>';
}
function viewNews(){
  var list=news.slice();
  if(S.newsCat!=='全部') list=list.filter(function(n){return n.category===S.newsCat;});
  if(S.newsKeyword){ var k=S.newsKeyword.trim(); list=list.filter(function(n){return n.title.indexOf(k)>-1||n.summary.indexOf(k)>-1||(n.tags||[]).join(',').indexOf(k)>-1;}); }
  list.sort(function(a,b){return (b.top?1:0)-(a.top?1:0)||(a.date<b.date?1:-1);});
  var top=(S.newsCat==='全部'&&!S.newsKeyword)?news.filter(function(n){return n.top;}):[];
  var h='<div class="search"><input id="newsSearch" placeholder="搜索资讯标题 / 标签" value="'+esc(S.newsKeyword)+'"/></div>';
  h+='<div class="cats">'+newsCategories.map(function(c){return '<div class="cat '+(S.newsCat===c?'on':'')+'" data-ncat="'+c+'">'+c+'</div>';}).join('')+'</div>';
  if(top.length){ h+='<div class="card"><div class="card-head"><div class="card-title">本周必看</div></div>'+top.map(function(n){
    var tg=n.importance==='必看'?'<span class="tag bad">必看</span>':n.importance==='重要'?'<span class="tag warn">重要</span>':'';
    return '<div class="top-item" data-news="'+n.id+'">'+tg+'<div class="top-title">'+esc(n.title)+'</div></div>';}).join('')+'</div>'; }
  h+='<div class="card">';
  if(list.length){ list.forEach(function(n){
    var tg=n.importance==='必看'?'<span class="tag bad">必看</span>':n.importance==='重要'?'<span class="tag warn">重要</span>':'';
    h+='<div class="news-item" data-news="'+n.id+'">'+
       newsThumb(n.category)+
       '<div class="ni-main">'+
         '<div class="ni-title">'+esc(n.title)+'</div>'+
         '<div class="ni-sum">'+esc(n.summary)+'</div>'+
         '<div class="ni-meta">'+tg+'<span class="muted">'+n.source+'</span><span class="ni-date">'+n.date+'</span></div>'+
       '</div></div>';
  }); } else { h+='<div class="empty">暂无匹配的资讯</div>'; }
  h+='</div><div class="legend">持续更新：算力政策 · AI 工厂 · 绿色算力 · 产业链动态</div>';
  return h;
}
function viewDetail(){
  var n=news.filter(function(x){return x.id===S.detailId;})[0];
  if(!n) return '<div class="empty">资讯不存在</div>';
  var faved=getFavs().indexOf(n.id)>-1;
  var tg=n.importance==='必看'?'<span class="tag bad">必看</span>':n.importance==='重要'?'<span class="tag warn">重要</span>':'';
  var body=n.body.split('\n').map(function(p){return '<div class="d-p">'+esc(p)+'</div>';}).join('');
  return '<div class="card"><div class="row" style="gap:6px"><span class="tag">'+n.category+'</span>'+tg+'</div>'+
    '<div class="d-title">'+esc(n.title)+'</div><div class="d-meta">'+n.date+' ｜ 来源：'+n.source+'</div>'+
    '<div class="d-summary">'+esc(n.summary)+'</div><div class="d-body">'+body+'</div>'+
    '<div class="ni-foot" style="margin-top:6px">'+(n.tags||[]).map(function(t){return '<span class="ni-tag">#'+t+'</span>';}).join('')+'</div></div>'+
    '<div class="d-actions"><div class="d-btn ghost" data-fav="'+n.id+'">'+(faved?'已收藏 ★':'收藏 ☆')+'</div><div class="d-btn" data-coop="">相关算力咨询 ›</div></div>';
}

/* ================= 合作咨询 ================= */
function viewCoop(){
  var f=S.form;
  var h='<div class="hero"><div class="infinity">∞</div><div class="hero-title">合作咨询</div>'+
    '<div class="hero-sub">算力租赁 · 私有化部署 · 数据中心合作 · 政企项目 · 产业合作<br/>提交需求后，我们会尽快与您联系</div></div>';
  h+='<div class="card"><div class="card-head"><div class="card-title">咨询方向</div></div>'+
    coopTypes.map(function(t){return '<div class="coop-type"><div class="ct-ico">'+t.ico+'</div><div><div class="ct-t">'+t.name+'</div><div class="ct-d">'+t.desc+'</div></div></div>';}).join('')+
  '</div>';
  h+='<div class="card"><div class="card-head"><div class="card-title">需求登记</div></div>'+
    '<div class="f-label">姓名<span class="req">*</span></div><input class="f-input" id="fName" placeholder="联系人姓名" value="'+esc(f.name)+'"/>'+
    '<div class="f-label">手机<span class="req">*</span></div><input class="f-input" id="fPhone" type="tel" maxlength="11" placeholder="联系电话" value="'+esc(f.phone)+'"/>'+
    '<div class="f-label">公司 / 机构</div><input class="f-input" id="fCompany" placeholder="选填" value="'+esc(f.company)+'"/>'+
    '<div class="f-label">所在城市</div><input class="f-input" id="fCity" placeholder="便于判断区域" value="'+esc(f.city)+'"/>'+
    '<div class="f-label">关注集群</div><div class="opts">'+coopClusters.map(function(c){return '<div class="opt '+(f.cluster===c?'on':'')+'" data-fcluster="'+c+'">'+c+'</div>';}).join('')+'</div>'+
    '<div class="f-label">需求类型</div><div class="opts">'+coopTypes.map(function(t){return '<div class="opt '+(f.type===t.name?'on':'')+'" data-ftype="'+t.name+'">'+t.name+'</div>';}).join('')+'</div>'+
    '<div class="f-label">需求描述</div><textarea class="f-input" id="fDetail" placeholder="简要说明您的算力需求（规模 / 场景 / 时间等）">'+esc(f.detail)+'</textarea>'+
  '</div>';
  h+='<div class="d-actions"><div class="d-btn" data-submit="1">提交咨询</div></div>'+
     '<div class="legend">提交即视为同意我们就合作事宜与您联系</div>';
  return h;
}
function syncForm(){
  function v(id){ var el=document.getElementById(id); return el?el.value:''; }
  S.form.name=v('fName'); S.form.phone=v('fPhone'); S.form.company=v('fCompany');
  S.form.city=v('fCity'); S.form.detail=v('fDetail');
}
function submitForm(){
  syncForm();
  var f=S.form;
  if(!f.name.trim()){ toast('请填写姓名'); return; }
  if(!/^1\d{10}$/.test(f.phone.trim())){ toast('请填写 11 位手机号'); return; }
  var leads=getLeads();
  leads.push({ name:f.name.trim(), phone:f.phone.trim(), company:f.company.trim(), city:f.city.trim(),
    cluster:f.cluster||'未选择', type:f.type||'未选择', detail:f.detail.trim(), time:new Date().toLocaleString('zh-CN') });
  setLeads(leads);
  S.form={ name:'', phone:'', company:'', city:'', cluster:'', type:'', detail:'' };
  render();
  toast('提交成功，我们会尽快与您联系');
}

/* ================= 我的 ================= */
function viewMine(){
  var ids=getFavs(); var favs=news.filter(function(n){return ids.indexOf(n.id)>-1;});
  var leads=getLeads();
  var h='<div class="hero"><div class="infinity">∞</div><div class="hero-title">金刚智算云</div>'+
    '<div class="hero-sub">AI 智算集群展示与算力资讯平台 ｜ 更新于 '+GLOBAL.updatedAt+'</div></div>';
  h+='<div class="card">'+
    '<div class="menu" data-go="cluster"><div class="m-ico">集</div><div class="m-t">算力集群</div><div class="m-arrow">›</div></div>'+
    '<div class="menu" data-go="news"><div class="m-ico" style="background:rgba(255,107,107,.12);color:#ff9a9a;border-color:rgba(255,107,107,.25)">讯</div><div class="m-t">算力资讯</div><div class="m-arrow">›</div></div>'+
    '<div class="menu" data-coop=""><div class="m-ico" style="background:rgba(62,240,176,.12);color:#3ef0b0;border-color:rgba(62,240,176,.25)">合</div><div class="m-t">合作咨询</div><div class="m-arrow">›</div></div>'+
    '<div class="menu" data-about="1"><div class="m-ico" style="background:rgba(255,255,255,.08);color:#a8c3e2;border-color:rgba(255,255,255,.15)">关</div><div class="m-t">关于我们</div><div class="m-arrow">›</div></div>'+
  '</div>';
  h+='<div class="card"><div class="card-head"><div class="card-title">我的收藏</div><div class="muted">'+favs.length+' 条</div></div>';
  if(favs.length){ favs.forEach(function(n){ h+='<div class="fav" data-news="'+n.id+'"><span class="tag">'+n.category+'</span><div class="fav-t">'+esc(n.title)+'</div></div>'; }); }
  else h+='<div class="empty">还没有收藏，去资讯里收藏感兴趣的内容吧</div>';
  h+='</div>';
  h+='<div class="card"><div class="card-head"><div class="card-title">我的咨询</div><div class="muted">'+leads.length+' 条</div></div>';
  if(leads.length){ leads.slice().reverse().forEach(function(l){
    h+='<div class="fav" style="cursor:default"><span class="tag ok">'+esc(l.type)+'</span><div class="fav-t">'+esc(l.cluster)+' ｜ '+esc(l.name)+' ｜ '+esc(l.time)+'</div></div>'; }); }
  else h+='<div class="empty">暂无咨询记录</div>';
  h+='</div><div class="legend">金刚智算云 · 公司算力业务统一入口</div>';
  return h;
}

/* ================= 路由 / 渲染 ================= */
var TITLES={index:'金刚智算云',cluster:'算力集群',news:'算力资讯',coop:'合作咨询',mine:'我的',detail:'资讯详情',clusterDetail:'集群详情'};
function render(){
  var view=S.sub||S.tab, html='';
  if(view==='index') html=viewIndex();
  else if(view==='cluster') html=viewCluster();
  else if(view==='clusterDetail') html=viewClusterDetail();
  else if(view==='news') html=viewNews();
  else if(view==='coop') html=viewCoop();
  else if(view==='mine') html=viewMine();
  else if(view==='detail') html=viewDetail();
  document.getElementById('content').innerHTML=html;
  document.getElementById('content').scrollTop=0;
  var c=clusters.filter(function(x){return x.id===S.clusterId;})[0];
  document.getElementById('navTitle').textContent=(view==='clusterDetail'&&c)?c.short+'集群':(TITLES[view]||'金刚智算云');
  document.getElementById('navBack').style.visibility=S.sub?'visible':'hidden';
  document.getElementById('tabbar').innerHTML=TABS.map(function(t){return '<div class="tab '+(!S.sub&&S.tab===t.key?'on':'')+'" data-tab="'+t.key+'"><div class="ico">'+t.ico+'</div><div>'+t.text+'</div></div>';}).join('');
}

/* ================= 事件 ================= */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-go],[data-cluster],[data-news],[data-ncat],[data-fav],[data-coop],[data-fcluster],[data-ftype],[data-submit],[data-about]');
  if(!t) return;
  var d=t.dataset;
  if(d.tab){ S.sub=null; S.tab=d.tab; render(); return; }
  if(d.go!==undefined){ S.sub=null; S.tab=d.go; render(); return; }
  if(d.cluster){ S.sub='clusterDetail'; S.clusterId=d.cluster; render(); return; }
  if(d.news){ S.sub='detail'; S.detailId=d.news; render(); return; }
  if(d.ncat){ S.newsCat=d.ncat; render(); return; }
  if(d.fav){ var f=getFavs(),id=d.fav; if(f.indexOf(id)>-1){f=f.filter(function(x){return x!==id;});toast('已取消收藏');}else{f.push(id);toast('已收藏');} setFavs(f); render(); return; }
  if(d.coop!==undefined){ if(d.coop) S.form.cluster=d.coop; S.sub=null; S.tab='coop'; render(); return; }
  if(d.fcluster){ syncForm(); S.form.cluster=d.fcluster; render(); return; }
  if(d.ftype){ syncForm(); S.form.type=d.ftype; render(); return; }
  if(d.submit){ submitForm(); return; }
  if(d.about){ alert('金刚智算云\nAI 智算集群展示与算力资讯平台\n\n主要提供 AI 算力集群展示、算力项目介绍、算力行业资讯及业务合作咨询服务，内容包括通州、酒泉、哈密等算力节点介绍。'); return; }
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='newsSearch'){
    S.newsKeyword=e.target.value;
    var cont=document.getElementById('content');
    var scroll=cont.scrollTop;
    cont.innerHTML=viewNews();
    var inp=document.getElementById('newsSearch'); if(inp){inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);}
    cont.scrollTop=scroll;
  }
});
document.getElementById('navBack').addEventListener('click',function(){
  if(S.sub==='clusterDetail'){ S.sub=null; S.tab='cluster'; }
  else S.sub=null;
  render();
});

render();
</script>
</body>
</html>
